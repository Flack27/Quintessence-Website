<!--
  Structure and class names are shared with the Codex's navbar and styled by
  ../../../../shared/navbar.css. Keep the two in step: anything visual belongs in
  that file, not here. The mobile toggle below is Angular-only and keeps its own
  classes; nothing in this bar reflects sign-in state.
-->
<nav class="qt-nav">
  <div class="qt-nav__inner navbar-container">
    <!-- Logo on the left -->
    <div class="qt-nav__start logo">
      <a routerLink="/" class="qt-nav__brand">
        <img src="/assets/logo.png" alt="Quintessence Logo" class="qt-nav__logo" />
        <span class="qt-nav__wordmark">Quintessence</span>
      </a>
    </div>
    <!-- Mobile Menu Toggle -->
    <div class="mobile-toggle" (click)="toggleMobileMenu()">
      <i class="fas" [ngClass]="isMobileMenuOpen ? 'fa-times' : 'fa-bars'"></i>
    </div>
    <!-- Navigation Links - right aligned -->
    <ul class="qt-nav__links" [ngClass]="{'mobile-open': isMobileMenuOpen}">
      <li><a class="qt-nav__link" routerLink="/" routerLinkActive="qt-nav__link--active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">Home</a></li>
      <li><a class="qt-nav__link" [href]="applyUrl" target="_blank" rel="noopener" (click)="closeMobileMenu()">Apply</a></li>
      <li><a class="qt-nav__link" routerLink="/games" routerLinkActive="qt-nav__link--active" (click)="closeMobileMenu()">Games</a></li>
      <li><a class="qt-nav__link" routerLink="/roster" routerLinkActive="qt-nav__link--active" (click)="closeMobileMenu()">Roster</a></li>
      <!-- The Codex is a separate app served at /guides by the same nginx, not an
           Angular route - so this must stay a plain href (a real page load).
           routerLink would hand it to the SPA router, which would miss and fall
           through to the '**' redirect back to home. -->
      <li><a class="qt-nav__link" href="/guides/" (click)="closeMobileMenu()">Codex</a></li>
      <!-- Nothing here reflects sign-in state. Admins reach /login directly, and the
           only signed-in controls live on the Codex page, which is where publishing
           happens. The session itself is site-wide either way. -->
    </ul>
  </div>
</nav>
